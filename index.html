<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Redactor - Igor Edition</title>
    <!-- Библиотека для экспорта HTML в картинку PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Импорт пиксельных шрифтов */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

        /* Инициализация CSS-переменных по умолчанию (Тема Мульти) */
        :root {
            --primary: #00ff66;
            --secondary: #ff3344;
            --tertiary: #00a2ff;
            --shadow-1: #ff003c;
            --shadow-2: #00f0ff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            image-rendering: pixelated;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Задний фон с матрицей */
        #binaryCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Эффект старого CRT-монитора */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Панель управления (вверху справа) */
        .header-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10000;
        }

        .binary-toggle-btn, .theme-toggle-btn {
            background: #111111;
            color: var(--primary);
            border: 3px solid var(--primary);
            padding: 8px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: 0.1s;
        }

        .binary-toggle-btn:hover, .theme-toggle-btn:hover {
            background: var(--primary);
            color: #000000;
        }

        /* Заголовок */
        header {
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }

        .logo-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 2.2rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 0;
            position: relative;
            display: inline-block;
            text-shadow: 
                -3px -3px 0 var(--shadow-1),  
                 3px  3px 0 var(--shadow-2);
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: -3px -3px 0 var(--shadow-1), 3px 3px 0 var(--shadow-2); }
            49% { text-shadow: -3px -3px 0 var(--shadow-1), 3px 3px 0 var(--shadow-2); }
            50% { text-shadow: 3px -3px 0 var(--shadow-1), -3px 3px 0 var(--shadow-2); }
            55% { text-shadow: -3px 3px 0 var(--shadow-1), 3px -3px 0 var(--shadow-2); }
            56% { text-shadow: -3px -3px 0 var(--shadow-1), 3px 3px 0 var(--shadow-2); }
            100% { text-shadow: -3px -3px 0 var(--shadow-1), 3px 3px 0 var(--shadow-2); }
        }

        .sub-logo {
            font-size: 14px;
            color: #888888;
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Главный контейнер */
        .container {
            width: 100%;
            max-width: 780px;
            background: #111111;
            border: 6px double #444444;
            box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.8);
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Вкладки */
        .tabs-bar {
            background: #090909;
            border-bottom: 4px solid #444444;
            display: flex;
            flex-wrap: wrap;
            padding: 8px 8px 0 8px;
            gap: 6px;
        }

        .tab {
            background: #1a1a1a;
            border: 3px solid #333333;
            border-bottom: none;
            padding: 10px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #888888;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab:hover {
            background: #222222;
            color: #ffffff;
            border-color: #555555;
        }

        .tab.active {
            background: #111111;
            color: var(--primary);
            border-color: #444444;
            border-bottom: 3px solid #111111;
            margin-bottom: -4px;
            z-index: 2;
        }

        .add-tab-btn {
            background: #2a080c;
            color: #ff3344;
            border: 3px solid #5a1018;
            border-bottom: none;
            padding: 10px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: 0.1s;
        }

        .add-tab-btn:hover {
            background: #4a1017;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 51, 68, 0.5);
        }

        .tab-close {
            background: #330000;
            color: #ff3333;
            border: 1px solid #ff3333;
            font-size: 10px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tab-close:hover {
            background: #ff3333;
            color: #000000;
        }

        /* Область редактора */
        .editor-content {
            background: #111111;
            padding: 24px;
            display: none;
        }

        .editor-content.active {
            display: block;
        }

        /* Поля ввода */
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            border: 3px solid #333333;
            padding: 10px;
            font-size: 16px;
            background: #080808;
            color: var(--primary);
            outline: none;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }

        /* Имя персонажа */
        .char-title-container {
            margin-bottom: 20px;
        }
        
        .char-title-input {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px !important;
            color: #ffffff !important;
            border: 3px solid #444444 !important;
            text-transform: uppercase;
            text-align: center;
        }

        /* Секции */
        .section-box {
            border: 3px solid #333333;
            padding: 16px;
            margin-bottom: 20px;
            background: #161616;
        }

        .section-box.red-zone {
            border-color: var(--secondary);
            background: #1c1113;
        }

        .section-box.blue-zone {
            border-color: var(--tertiary);
            background: #11161c;
        }

        .section-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #888888;
            text-transform: uppercase;
        }

        .red-zone .section-title { color: var(--secondary); }
        .blue-zone .section-title { color: var(--tertiary); }

        .section-box textarea {
            min-height: 95px;
            resize: vertical;
        }

        /* Сетка внешнего вида */
        .appearance-grid {
            display: flex;
            gap: 20px;
        }

        .appearance-desc {
            flex: 1;
            min-height: 200px;
            resize: vertical;
        }

        /* Контейнер для загрузчика и кнопок управления */
        .photo-control-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        /* КРУПНЫЙ Портрет Персонажа */
        .image-uploader-large {
            width: 260px;
            height: 360px;
            border: 4px dashed #444444;
            background: #020202;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .image-uploader-large:hover {
            border-color: var(--tertiary);
            box-shadow: 0 0 15px var(--tertiary);
        }

        .image-uploader-large img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #050505;
            position: absolute;
            top: 0;
            left: 0;
        }

        .uploader-placeholder-large {
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #555555;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            line-height: 1.5;
        }

        .glitch-face-icon-large {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            fill: #ffffff;
        }

        /* Кнопка приближения (Zoom) */
        .zoom-btn {
            background: #111111;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 6px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: 0.1s;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
        }

        .zoom-btn:hover {
            background: var(--primary);
            color: #000000;
        }

        .zoom-btn:disabled {
            border-color: #444444;
            color: #444444;
            cursor: not-allowed;
            box-shadow: none;
            background: #111111;
        }

        /* Способности / Прокачка */
        .abilities-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: var(--secondary);
            margin: 25px 0 15px 0;
            border-bottom: 3px double #444444;
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .ability-item {
            display: flex;
            gap: 12px;
            border: 3px solid #333333;
            background: #151515;
            padding: 12px;
            margin-bottom: 16px;
            position: relative;
        }

        .ability-photo-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 80px;
            flex-shrink: 0;
        }

        .ability-image-uploader {
            width: 80px;
            height: 80px;
            border: 3px solid #444444;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .ability-image-uploader img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ability-zoom-btn {
            font-size: 6px;
            padding: 4px;
        }

        .ability-inputs {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ability-name-input {
            height: 32px;
            font-size: 14px;
            border-color: #444444;
        }

        .ability-desc-input {
            flex-grow: 1;
            min-height: 48px;
            resize: vertical;
            font-size: 13px;
            border-color: #444444;
        }

        .delete-ability-btn {
            background: #3a080c;
            color: #ff3344;
            border: 3px solid #5a1018;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 0 10px;
            height: 32px;
            align-self: flex-start;
            transition: 0.1s;
        }

        .delete-ability-btn:hover {
            background: #ff3344;
            color: #000000;
        }

        /* Шаблон Товер Дефенса (Стили Прокачки) */
        .level-badge {
            width: 80px;
            height: 80px;
            background: #1a1a1a;
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--primary);
            text-align: center;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .td-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 4px 0;
        }

        .td-stat-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .td-stat-label {
            font-size: 11px;
            color: #888888;
            text-transform: uppercase;
        }

        .td-stat-input {
            height: 28px !important;
            padding: 4px !important;
            font-size: 12px !important;
        }

        .td-upgrade-header {
            display: flex;
            gap: 8px;
        }

        .td-cost-input-wrapper {
            position: relative;
            width: 120px;
            flex-shrink: 0;
        }

        .td-cost-input-wrapper input {
            padding-right: 25px;
        }

        .td-cost-input-wrapper::after {
            content: "$";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
        }

        /* Чекбоксы доп способностей */
        .td-detection-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            border: 2px solid #333;
            background: #090909;
            width: 100%;
        }

        .detection-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 11px;
            user-select: none;
        }

        .detection-toggle span.checkbox-ui {
            color: var(--secondary);
            font-weight: bold;
        }

        .detection-toggle.active span.checkbox-ui {
            color: var(--primary);
        }

        /* Блок ДПС */
        .td-dps-column {
            width: 100px;
            border-left: 3px double #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-shrink: 0;
            padding: 8px;
        }

        .td-dps-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--secondary);
            margin-bottom: 6px;
        }

        .td-dps-value {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        /* Вложенная Способность внутри уровня TD */
        .lvl-ability-item {
            display: flex;
            gap: 12px;
            border: 2px dashed var(--primary);
            background: #080808;
            padding: 8px;
            margin-top: 6px;
            position: relative;
            width: 100%;
        }

        .add-lvl-ability-btn {
            background: #111111;
            color: var(--primary);
            border: 2px solid var(--primary);
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 4px 6px;
            cursor: pointer;
            margin-top: 8px;
            text-transform: uppercase;
            width: 100%;
            transition: 0.1s;
        }

        .add-lvl-ability-btn:hover {
            background: var(--primary);
            color: #000000;
        }

        /* Добавить способность / Прокачку */
        .add-ability-container {
            margin-top: 20px;
        }

        .add-ability-btn {
            background: #111111;
            color: var(--primary);
            border: 3px solid var(--primary);
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.1s;
            width: 100%;
            justify-content: center;
            text-transform: uppercase;
        }

        .add-ability-btn:hover {
            background: var(--primary);
            color: #000000;
            box-shadow: 0 0 15px var(--primary);
        }

        /* КНОПКА ЭКСПОРТА АНКЕТЫ */
        .actions-row {
            margin-top: 30px;
            border-top: 4px double #444444;
            padding-top: 24px;
            display: flex;
            justify-content: center;
        }

        .export-card-btn {
            background: var(--secondary);
            color: #ffffff;
            border: 4px solid #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 18px 24px;
            cursor: pointer;
            box-shadow: 6px 6px 0px #000;
            transition: 0.1s;
            text-transform: uppercase;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .export-card-btn:hover {
            background: var(--primary);
            color: #000000;
            border-color: #000000;
            box-shadow: 8px 8px 0px var(--secondary);
            transform: translate(-2px, -2px);
        }

        /* ДИАЛОГ ВЫБОРА ТИПА ПЕРСОНАЖА (MODAL) */
        .type-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 30000;
            justify-content: center;
            align-items: center;
        }

        .type-modal-content {
            background: #111;
            border: 6px double #444444;
            padding: 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,102,0.2);
        }

        .type-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 24px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        .type-btn {
            background: #2a080c;
            color: #ff3344;
            border: 3px solid #5a1018;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 16px;
            width: 100%;
            margin-bottom: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.1s;
        }

        .type-btn:hover {
            background: var(--primary);
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 10px var(--primary);
        }

        .type-btn-close {
            background: #222;
            color: #888;
            border: 2px solid #444;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .type-btn-close:hover {
            background: #333;
            color: #fff;
        }

        /* МОДАЛЬНОЕ ОКНО ПРИБЛИЖЕНИЯ */
        .zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .zoom-modal-content {
            max-width: 90%;
            max-height: 90%;
            border: 6px double var(--primary);
            box-shadow: 0 0 30px var(--primary);
            background: #111;
            object-fit: contain;
        }

        /* Скрытые инпуты */
        .file-input {
            display: none;
        }

        /* Адаптивность */
        @media (max-width: 680px) {
            .appearance-grid {
                flex-direction: column-reverse;
                align-items: center;
            }
            .image-uploader-large {
                width: 100%;
                max-width: 320px;
                height: 380px;
            }
            .header-controls {
                position: absolute;
                top: 10px;
                right: 10px;
            }
            .ability-item {
                flex-direction: column;
            }
            .td-dps-column {
                width: 100%;
                border-left: none;
                border-top: 3px double #333333;
                padding-top: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Канвас матрицы -->
    <canvas id="binaryCanvas"></canvas>

    <!-- Панель управления (вверху справа) -->
    <div class="header-controls">
        <button id="themeToggle" class="theme-toggle-btn" onclick="nextTheme()">[ ПАЛИТРА: МУЛЬТИ ]</button>
        <button id="binaryToggle" class="binary-toggle-btn">[ MATRIX: ON ]</button>
    </div>

    <header>
        <h1 class="logo-text">Character Redactor</h1>
        <div class="sub-logo">[ system state: corrupted ]</div>
    </header>

    <div class="container">
        <!-- Вкладки -->
        <div class="tabs-bar" id="tabsBar">
            <button class="add-tab-btn" onclick="openTypeModal()">+ ПЕРС</button>
        </div>

        <!-- Контейнер для редакторов -->
        <div id="editorsContainer"></div>
    </div>

    <!-- Модалка выбора типа персонажа -->
    <div id="typeModal" class="type-modal">
        <div class="type-modal-content">
            <div class="type-modal-title">ВЫБЕРИТЕ ТИП СУБЪЕКТА</div>
            <button class="type-btn" onclick="addNewCharacter('asim')">🧬 Асим (Персонаж)</button>
            <button class="type-btn" onclick="addNewCharacter('td')">🏰 Товер Дефенс (Башня)</button>
            <button class="type-btn-close" onclick="closeTypeModal()">Отмена</button>
        </div>
    </div>

    <!-- Модалка зума картинок -->
    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <img id="zoomModalImg" class="zoom-modal-content" src="" alt="Zoomed image">
    </div>

    <!-- Заготовка жуткого глитч-лица (большая) -->
    <svg id="defaultSmileLarge" style="display:none;">
        <svg viewBox="0 0 100 100" class="glitch-face-icon-large">
            <rect x="22" y="28" width="16" height="24" fill="#444444"/>
            <rect x="62" y="28" width="16" height="24" fill="#444444"/>

        function applyTheme(themeKey) {

            root.style.setProperty('--secondary', theme.secondary);
            root.style.setProperty('--tertiary', theme.tertiary);

            document.getElementById('themeToggle').innerText = `[ ПАЛИТРА: ${theme.name} ]`;
            localStorage.setItem('selected_theme', themeKey);

        function nextTheme() {
            let current = localStorage.getItem('selected_theme') || 'multi';
            let idx = themeKeys.indexOf(current);
            let nextIdx = (idx + 1) % themeKeys.length;
            applyTheme(themeKeys[nextIdx]);

        // --- ЛОГИКА ДВОИЧНОЙ МАТРИЦЫ ---
        const canvas = document.getElementById('binaryCanvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let binaryActive = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;

        function drawBinary() {
            if (!binaryActive) return;
            
            ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const activeThemeKey = localStorage.getItem('selected_theme') || 'multi';
            const themeObj = themes[activeThemeKey];
            
            ctx.fillStyle = themeObj ? themeObj.primary : '#00ff66';
            ctx.globalAlpha = 0.15;
            ctx.font = fontSize + 'px "Share Tech Mono"';

            columns = canvas.width / fontSize;
            while (drops.length < columns) drops.push(1);

            for(let i = 0; i < drops.length; i++) {
                const text = Math.random() > 0.5 ? "1" : "0";
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            ctx.globalAlpha = 1.0;
            animationFrameId = requestAnimationFrame(drawBinary);
        }

        const toggleBtn = document.getElementById('binaryToggle');
        const savedMatrixState = localStorage.getItem('binary_matrix_active');
        if (savedMatrixState === 'false') {
            binaryActive = false;
            toggleBtn.innerText = '[ MATRIX: OFF ]';
            toggleBtn.style.color = '#888888';
            toggleBtn.style.borderColor = '#444444';
        } else {
            drawBinary();
        }

        toggleBtn.onclick = () => {
            binaryActive = !binaryActive;
            if (binaryActive) {
                toggleBtn.innerText = '[ MATRIX: ON ]';
                toggleBtn.style.color = 'var(--primary)';
                toggleBtn.style.borderColor = 'var(--primary)';
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawBinary();
            } else {
                toggleBtn.innerText = '[ MATRIX: OFF ]';
                toggleBtn.style.color = '#888888';
                toggleBtn.style.borderColor = '#444444';
                cancelAnimationFrame(animationFrameId);
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            localStorage.setItem('binary_matrix_active', binaryActive);

                        char.upgrades.forEach(upg => {
                            if (!upg.abilities) upg.abilities = [];
                        });
                    }
                });

                if (characters.length > 0) {
                    activeCharId = characters[0].id;
                }
            } else {
                createIgorCharacter();
            }
            renderTabs();
            renderEditors();
        }

        function deleteCharacter(id, event) {
            event.stopPropagation();
            if (characters.length <= 1) {
                alert("Нельзя уничтожить последнего субъекта.");
                return;
            }
            if (confirm("Вы уверены, что хотите стереть этого субъекта?")) {
                characters = characters.filter(c => c.id !== id);
                if (activeCharId === id) {
                    activeCharId = characters[0].id;
                }
                saveData();
                renderTabs();
                renderEditors();
            }
        }

        // --- ДОП. ФУНКЦИИ ТОВЕР ДЕФЕНСА ---
        function addTDLevel(charId) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                const nextLevel = char.upgrades.length;
                const prevLevelUpg = char.upgrades[nextLevel - 1];

                const duplicatedAbilities = prevLevelUpg && prevLevelUpg.abilities ? 
                    prevLevelUpg.abilities.map(ab => ({
                        id: Date.now() + Math.random(),
                        name: ab.name,
                        desc: ab.desc,
                        img: ab.img
                    })) : [];

                char.upgrades.push({
                    id: Date.now(),
                    level: nextLevel,
                    name: `Прокачка ${nextLevel} ур.`,
                    cost: 100 * nextLevel,
                    damage: 10 + (5 * nextLevel),
                    rate: 1.0,
                    range: 6 + nextLevel,
                    desc: "",
                    seeCamo: prevLevelUpg ? prevLevelUpg.seeCamo : false,
                    seeFlying: prevLevelUpg ? prevLevelUpg.seeFlying : false,
                    abilities: duplicatedAbilities
                });
                saveData();
                renderEditors();
            }
        }

        function deleteTDLevel(charId, upgId) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                char.upgrades = char.upgrades.filter(upg => upg.id !== upgId);
                char.upgrades.forEach((upg, idx) => {
                    upg.level = idx;
                });
                saveData();
                renderEditors();
            }
        }

        function updateTDStat(charId, upgId, statName, value) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                const upg = char.upgrades.find(u => u.id === upgId);
                if (upg) {
                    upg[statName] = parseFloat(value) || 0;
                    saveData();
                    
                    const dpsVal = upg.rate > 0 ? (upg.damage / upg.rate).toFixed(1) : "0";
                    const dpsContainer = document.getElementById(`dps-${upgId}`);
                    if (dpsContainer) dpsContainer.innerText = dpsVal;
                }
            }
        }

        function addTDLevelAbility(charId, upgId) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                const upg = char.upgrades.find(u => u.id === upgId);
                if (upg) {
                    if (!upg.abilities) upg.abilities = [];
                    upg.abilities.push({
                        id: Date.now(),
                        name: "",
                        desc: "",
                        img: ""
                    });
                    saveData();
                    renderEditors();
                }
            }
        }

        function deleteTDLevelAbility(charId, upgId, abId) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                const upg = char.upgrades.find(u => u.id === upgId);
                if (upg && upg.abilities) {
                    upg.abilities = upg.abilities.filter(ab => ab.id !== abId);
                    saveData();
                    renderEditors();
                }
            }
        }

        function updateTDLevelAbilityField(charId, upgId, abId, fieldName, value) {
            const char = characters.find(c => c.id === charId);
            if (char && char.upgrades) {
                const upg = char.upgrades.find(u => u.id === upgId);
                if (upg && upg.abilities) {
                    const ab = upg.abilities.find(a => a.id === abId);
                    if (ab) {
                        ab[fieldName] = value;
                        saveData();
                    }
                }
            }
        }

        function handleTDLevelAbilityImageUpload(event, charId, upgId, abId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 150;
                    canvas.height = 150;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 150, 150);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const char = characters.find(c => c.id === charId);
                    if (char && char.upgrades) {
                        const upg = char.upgrades.find(u => u.id === upgId);
                        if (upg && upg.abilities) {
                            const ab = upg.abilities.find(a => a.id === abId);
                            if (ab) {
                                ab.img = compressedDataUrl;
                                saveData();
                                renderEditors();
                            }
                        }
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function updateField(charId, fieldName, value) {
            const char = characters.find(c => c.id === charId);
            if (char) {
                char[fieldName] = value;
                saveData();
                if (fieldName === 'name') {
                    renderTabs();
                }
            }
        }

        function handleImageUpload(event, charId, fieldName) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const char = characters.find(c => c.id === charId);
                    if (char) {
                        char[fieldName] = compressedDataUrl;
                        saveData();
                        renderEditors();
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function addAbility(charId) {
            const char = characters.find(c => c.id === charId);
            if (char) {
                char.abilities.push({
                    id: Date.now(),
                    name: "",
                    desc: "",
                    img: ""
                });
                saveData();
                renderEditors();
            }
        }

        function deleteAbility(charId, abId) {
            const char = characters.find(c => c.id === charId);
            if (char) {
                char.abilities = char.abilities.filter(ab => ab.id !== abId);
                saveData();
                renderEditors();
            }
        }

        function updateAbilityField(charId, abId, fieldName, value) {
            const char = characters.find(c => c.id === charId);
            if (char) {
                const ab = char.abilities.find(a => a.id === abId);
                if (ab) {
                    ab[fieldName] = value;
                    saveData();
                }
            }
        }

        function handleAbilityImageUpload(event, charId, abId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 150;
                    canvas.height = 150;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 150, 150);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const char = characters.find(c => c.id === charId);
                    if (char) {
                        const ab = char.abilities.find(a => a.id === abId);
                        if (ab) {
                            ab.img = compressedDataUrl;
                            saveData();
                            renderEditors();
                        }
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        window.onload = loadData;
    </script>
</body>
</html>
